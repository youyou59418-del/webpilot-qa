[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webpilot-qa"
version = "0.1.0"
description = "Verifiable and self-recovering browser testing agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "playwright==1.62.0",
    "pydantic>=2",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["webpilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
