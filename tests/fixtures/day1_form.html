<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebPilot Day1 Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 60px auto;
            padding: 24px;
        }

        input {
            width: 300px;
            padding: 10px;
            margin-right: 8px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 24px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>WebPilot-QA Day 1</h1>

<label for="name-input">
    Your Name
</label>

<br><br>

<input
    id="name-input"
    placeholder="Enter your name"
/>

<button
    id="submit-button"
    onclick="submitName()"
>
    Submit
</button>

<div id="result">
    Waiting...
</div>

<script>
function submitName() {
    const name =
        document.getElementById(
            "name-input"
        ).value;

    document.getElementById(
        "result"
    ).textContent =
        "Hello, " + name + "!";
}
</script>

</body>
</html>
